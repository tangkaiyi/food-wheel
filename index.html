<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17120f" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="吃什麼" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>今天吃什麼</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-mode="nearby">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">🍜</span>
      <h1>今天吃什麼</h1>
    </div>
    <button id="btn-sound" class="icon-btn" aria-label="音效開關">🔊</button>
  </header>

  <!-- 轉盤來源：附近的店，或自己存的清單 -->
  <nav class="tabs" id="tabs" aria-label="轉盤來源"></nav>

  <main>
    <section class="card nearby-only">
      <div class="row">
        <button id="btn-locate" class="primary">📍 用我的位置找</button>
        <span id="loc-status" class="muted" role="status"></span>
      </div>
      <details id="manual-loc">
        <summary>改用地址搜尋</summary>
        <form id="addr-form" class="row">
          <input id="addr-input" type="text" placeholder="例：台北車站、信義區松仁路" enterkeyhint="search" />
          <button type="submit">搜尋</button>
        </form>
      </details>
    </section>

    <section class="wheel-wrap">
      <div class="wheel-box">
        <svg class="pointer" id="pointer" viewBox="0 0 40 48" aria-hidden="true">
          <path d="M20 46 L6 24 A16 16 0 1 1 34 24 Z" />
          <circle cx="20" cy="16" r="5.5" />
        </svg>
        <canvas id="wheel" width="360" height="360" aria-label="轉盤，點一下開轉"></canvas>
        <button id="btn-spin" class="spin-btn" disabled>GO</button>
      </div>
      <p id="wheel-note" class="muted center"></p>
      <button id="btn-shuffle" class="ghost pill" hidden>🔀 換一批上轉盤</button>
    </section>

    <section class="card">
      <div class="nearby-only">
        <div class="field first">
          <label>範圍</label>
          <div class="seg" id="radius-seg">
            <button data-v="300">300m</button>
            <button data-v="500">500m</button>
            <button data-v="1000">1km</button>
            <button data-v="2000">2km</button>
          </div>
        </div>

        <div class="field">
          <label>類型</label>
          <div class="chips" id="type-chips">
            <label><input type="checkbox" value="restaurant" />🍚 餐廳</label>
            <label><input type="checkbox" value="fast_food" />🍔 小吃 / 速食</label>
            <label><input type="checkbox" value="cafe" />🧋 咖啡 / 飲料</label>
            <label><input type="checkbox" value="dessert" />🍰 甜點 / 麵包</label>
          </div>
        </div>

        <div class="field" id="rating-field" hidden>
          <label>評分</label>
          <div class="seg" id="rating-seg">
            <button data-v="0">不限</button>
            <button data-v="3.5">★3.5+</button>
            <button data-v="4">★4.0+</button>
            <button data-v="4.5">★4.5+</button>
          </div>
        </div>
      </div>

      <div class="toggles">
        <label class="switch nearby-only" id="open-field" hidden>只轉現在有開的店<input type="checkbox" id="open-only" /></label>
        <label class="switch">避開這 3 天吃過的<input type="checkbox" id="avoid-recent" /></label>
      </div>
    </section>

    <section class="card">
      <div class="row between">
        <h2><span id="list-title">候選名單</span> <span id="count" class="count"></span></h2>
        <div class="row tight">
          <button id="btn-all" class="ghost small">全選</button>
          <button id="btn-none" class="ghost small">全不選</button>
        </div>
      </div>
      <div class="row tight list-tools list-only">
        <button id="btn-rename" class="link">✎ 改名</button>
        <button id="btn-delete-list" class="link danger">🗑 刪除這個清單</button>
      </div>
      <form id="custom-form" class="row list-only">
        <input id="custom-input" type="text" placeholder="加一家店：例如「巷口滷肉飯」" maxlength="30" enterkeyhint="done" />
        <button type="submit">加入</button>
      </form>
      <ul id="list" class="list"></ul>
      <p id="source-note" class="muted tiny nearby-only"></p>
    </section>

    <section class="card" id="history-card" hidden>
      <div class="row between">
        <h2>最近吃過</h2>
        <button id="btn-clear-history" class="ghost small">清除</button>
      </div>
      <ul id="history" class="list"></ul>
    </section>
  </main>

  <dialog id="result">
    <div class="result-body">
      <div class="result-emoji" aria-hidden="true">🎉</div>
      <p class="muted">就決定是</p>
      <h2 id="r-name"></h2>
      <p id="r-meta" class="muted"></p>
      <a id="r-map" class="primary block" target="_blank" rel="noopener">🗺️ 就吃這家，帶我去</a>
      <div class="grid2">
        <button id="r-again">再轉一次</button>
        <button id="r-drop">不要這家，再轉</button>
      </div>
      <div class="row center extra">
        <button id="r-save" class="link nearby-only"></button>
        <button id="r-share" class="link" hidden>📤 分享給朋友</button>
      </div>
    </div>
  </dialog>

  <dialog id="picker">
    <h3>加入清單</h3>
    <p id="picker-name" class="muted"></p>
    <ul id="picker-lists" class="list"></ul>
    <div class="row between dialog-actions">
      <button id="picker-new" class="ghost">＋ 新清單</button>
      <button id="picker-done" class="primary">完成</button>
    </div>
  </dialog>

  <dialog id="name-dialog">
    <form method="dialog">
      <h3 id="name-title"></h3>
      <input id="name-input" type="text" maxlength="20" required enterkeyhint="done" placeholder="例如：公司附近、宵夜" />
      <div class="row between dialog-actions">
        <button type="button" id="name-cancel" class="ghost">取消</button>
        <button type="submit" value="ok" class="primary">確定</button>
      </div>
    </form>
  </dialog>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="toast" popover="manual" role="status"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
